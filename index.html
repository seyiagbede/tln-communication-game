<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141414"><title>TLN | Communication Style Discovery</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#171717;background:#f4f2f0}*{box-sizing:border-box}body{margin:0}header{background:#141414;color:white;padding:18px 22px;border-bottom:5px solid #bf142b}header strong{letter-spacing:.13em;font-size:12px}main{max-width:720px;margin:24px auto;padding:0 16px 40px}.panel{background:white;border:1px solid #e4dfda;border-radius:18px;padding:clamp(20px,5vw,38px);box-shadow:0 8px 30px #0000000a}.eyebrow{color:#b41930;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(29px,6vw,45px);line-height:1.09;margin:14px 0}h2{font-size:clamp(24px,5vw,34px);line-height:1.18}p{line-height:1.6;color:#4b4b4b}.muted{font-size:13px;color:#666}.btn{border:0;border-radius:10px;background:#c21934;color:white;padding:15px 22px;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.btn.secondary{background:#191919}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.option{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:#fafafa;border:2px solid #e6e1dc;border-radius:12px;padding:16px;margin:10px 0;cursor:pointer;font-size:16px;line-height:1.4;color:#171717}.option:hover,.option:focus{border-color:#a51b30}.option.chosen{background:#fff2f4;border-color:#c21934}.letter{display:inline-grid;place-items:center;flex:none;border-radius:7px;width:30px;height:30px;background:#eee;font-weight:800}.option.chosen .letter{background:#c21934;color:white}.progress{height:7px;background:#e8e8e8;border-radius:10px;overflow:hidden;margin:14px 0 26px}.bar{height:100%;background:#c21934;transition:width .2s}.tag{display:inline-block;padding:7px 11px;background:#f8e8eb;color:#a71930;border-radius:20px;font-size:12px;font-weight:800}.result{border-left:4px solid #c21934;padding-left:16px;margin:20px 0}.score{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:12px 0}.track{height:9px;background:#eee;border-radius:12px;overflow:hidden;grid-column:1/-1;margin-bottom:7px}.fill{height:100%;background:#b61a31}.fine{border-top:1px solid #e7e1dd;padding-top:18px;margin-top:25px}.hide{display:none}footer{text-align:center;font-size:12px;color:#777;margin-top:20px}button:focus-visible{outline:3px solid #141414;outline-offset:3px}@media(prefers-reduced-motion:reduce){.bar{transition:none}}</style></head>
<body><header><strong>TAYSEY LEADERSHIP NETWORK</strong></header><main><section class="panel" id="app" aria-live="polite"></section><footer>TLN Leadership Accelerator · Module 2 · Informal learning reflection</footer></main>
<script>
const questions=[
["Your team needs an urgent decision. You naturally…","Push towards a decision and action.","Examine the facts and risks.","Encourage ideas and discussion.","Consider how everyone will be affected."],
["A major organisational change is announced. You first…","Ask what needs to happen next.","Ask for evidence and details.","Explore the possibilities.","Ask how people will be supported."],
["When leading a meeting, you prioritise…","Results and clear actions.","Structure and accuracy.","Energy and participation.","Harmony and inclusion."],
["When a project encounters problems, you…","Take charge and act quickly.","Analyse the root cause.","Rally people around solutions.","Check on those affected."],
["A colleague brings you a new proposal. You ask…","What decision do we need?","What evidence supports it?","Who could we involve?","How will it affect the team?"],
["When giving project updates, you tend to…","Lead with the bottom line and next steps.","Explain progress, data and risks.","Share the big picture and opportunities.","Explain how people are doing and what support is needed."],
["When receiving feedback, you value…","Directness and practical next steps.","Specific examples and accuracy.","Encouragement and an open discussion.","Thoughtful delivery and space to reflect."],
["In a challenging conversation, your first instinct is to…","Address the issue promptly.","Clarify exactly what happened.","Talk through possible solutions.","Understand how the other person feels."]
];
const styles=[
{title:"Driver",subtitle:"Results-oriented",strength:"You tend to bring direction, decisiveness and momentum.",blind:"Under pressure, you may seem impatient or move faster than others can follow.",adapt:"Pause to invite perspectives, explain the why and check understanding."},
{title:"Analytical",subtitle:"Detail-oriented",strength:"You tend to bring evidence, careful thinking and structure.",blind:"You may overanalyse or delay decisions while seeking more information.",adapt:"Lead with a concise recommendation, then offer supporting detail."},
{title:"Expressive",subtitle:"Influence-oriented",strength:"You tend to bring energy, ideas and relational connection.",blind:"You may lose focus or overlook essential details.",adapt:"Make the key action, owner and deadline explicit."},
{title:"Stable",subtitle:"Support-oriented",strength:"You tend to bring patience, empathy and collaboration.",blind:"You may avoid necessary conflict or leave expectations unclear.",adapt:"State your position respectfully and agree concrete next steps."}
];
const optionOrders=[[2,0,3,1],[1,3,0,2],[3,2,1,0],[0,3,2,1],[2,1,0,3],[3,0,1,2],[1,2,3,0],[0,2,1,3]];
const app=document.getElementById("app");let step=-1,answers=[];const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
function start(){step=0;answers=[];render()}
function render(){
if(step===-1){app.innerHTML='<span class="eyebrow">Interactive discovery · 3 minutes</span><h1>What’s your communication preference?</h1><p>Eight quick workplace scenarios. Discover the communication approach you naturally lean towards, plus one practical way to become more adaptable.</p><p class="muted">There are no right or wrong answers. Choose what you would naturally do—not what you think a leader should do.</p><div class="actions"><button class="btn" id="start">Start discovery →</button></div><p class="fine muted">This is an informal reflection exercise, not a validated DISC or personality assessment. Your answers stay on this device and are not collected.</p>';document.getElementById("start").onclick=start;return}
if(step>=questions.length){results();return}
let q=questions[step],v=optionOrders[step].indexOf(answers[step]);if(answers[step]===undefined)v=undefined;app.innerHTML='<span class="eyebrow">Question '+(step+1)+' of '+questions.length+'</span><div class="progress" aria-label="Progress"><div class="bar" style="width:'+Math.round(step/questions.length*100)+'%"></div></div><h2>'+esc(q[0])+'</h2><div id="choices">'+optionOrders[step].map((styleIndex,i)=>'<button type="button" class="option '+(v===i?'chosen':'')+'" data-i="'+i+'" aria-pressed="'+(v===i)+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(q[styleIndex+1])+'</span></button>').join('')+'</div><div class="actions"><button class="btn" id="next" '+(v===undefined?'disabled':'')+'>'+(step===questions.length-1?'See my result →':'Next →')+'</button>'+(step>0?'<button class="btn secondary" id="back">← Back</button>':'')+'</div>';app.querySelectorAll(".option").forEach(b=>b.onclick=()=>{answers[step]=optionOrders[step][Number(b.dataset.i)];render()});document.getElementById("next").onclick=()=>{step++;render()};if(step>0)document.getElementById("back").onclick=()=>{step--;render()}
}
function results(){const counts=[0,0,0,0];answers.forEach(i=>counts[i]++);let max=Math.max(...counts),leaders=counts.map((n,i)=>n===max?i:-1).filter(i=>i>=0),primary=leaders[0];let headline=leaders.length===1?styles[primary].title+" communicator":"A blended communication preference";let names=leaders.map(i=>styles[i].title).join(" + ");let details=leaders.length===1?'<div class="result"><strong>'+styles[primary].subtitle+'</strong><p>'+styles[primary].strength+'</p><p><strong>Potential blind spot:</strong> '+styles[primary].blind+'</p><p><strong>Try this:</strong> '+styles[primary].adapt+'</p></div>':'<div class="result"><p>Your answers suggest a mix of '+names+'. This is normal: preferences vary by situation.</p><p><strong>Try this:</strong> Notice what each audience needs, then adapt your message without changing the facts.</p></div>';let summary='TLN Communication Style Discovery: '+headline+' ('+counts.map((n,i)=>styles[i].title+' '+n+'/8').join(', ')+'). Informal reflection, not a validated assessment.';app.innerHTML='<span class="tag">Your result</span><h1>'+headline+'</h1><p>Your answers most often reflected <strong>'+names+'</strong>.</p>'+details+'<h3>Your response pattern</h3>'+counts.map((n,i)=>'<div class="score"><strong>'+styles[i].title+'</strong><span>'+n+' / 8</span><div class="track"><div class="fill" style="width:'+(n/8*100)+'%"></div></div></div>').join('')+'<div class="fine"><h3>Put it into practice</h3><p>Think of a colleague with different communication needs. What could you change about the <em>clarity, detail, energy or reassurance</em> in your next conversation?</p><p class="muted">Keep this result for your Behavioural Communication Reflection workbook task. This quick activity does not replace formal portfolio evidence.</p></div><div class="actions"><button class="btn" id="copy">Copy my result</button><button class="btn secondary" id="restart">Play again</button></div><p id="status" class="muted" role="status"></p><p class="fine muted">Informal reflection only—not a validated DISC assessment. No answers are uploaded or stored.</p>';document.getElementById("restart").onclick=()=>{step=-1;answers=[];render()};document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(summary);document.getElementById("status").textContent="Result copied."}catch(e){document.getElementById("status").textContent="Copy unavailable on this device. You can take a screenshot instead."}}}
render();
</script></body></html>
